name: ci
on: [push, pull_request]
jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Evaluation gate (fails the build if quality regresses vs baseline)
        run: |
          studyrag --llm extractive ingest data/notes
          studyrag --llm extractive eval --fail-on-regression
      - uses: actions/upload-artifact@v4
        with: { name: eval-report, path: evals/report.html }
